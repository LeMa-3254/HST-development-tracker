name: HST Intelligence Weekly

on:
  workflow_dispatch:
    inputs:
      weekly_synthesis:
        description: "Generate weekly synthesis"
        required: false
        default: true
        type: boolean
      rescore_all:
        description: "Re-score the whole archive against the current rubric (one-time maintenance)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 15 * * 2"   # Tuesdays 15:00 UTC = 8:00 AM PDT — one weekly run, with synthesis

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hst-intelligence-weekly
  cancel-in-progress: false

jobs:
  run-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run offline tests
        run: python -m unittest discover -s tests

      - name: Run tracker pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ inputs.rescore_all }}" = "true" ]; then
            python pipeline/run.py --config targeting.yaml --db data/tracker.db --rescore-all
          elif [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.weekly_synthesis }}" = "true" ]; then
            python pipeline/run.py --config targeting.yaml --db data/tracker.db --weekly-synthesis
          else
            python pipeline/run.py --config targeting.yaml --db data/tracker.db
          fi

      - name: Build static site
        run: python site/build.py --config targeting.yaml --db data/tracker.db --output public

      - name: Commit tracker database when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tracker.db
          if ! git diff --cached --quiet; then
            git commit -m "Update tracker database"
            git pull --rebase --autostash
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
